# mcpgate example configuration.
# Copy this file and replace the placeholder credentials before use.
# Backend credentials and API keys are never logged by mcpgate.

listen: ":8080"

# Clients authenticate with X-API-Key or `Authorization: Bearer <key>`.
# Rotate these before any real deployment; the demo key below is public.
api_keys:
  - key: "demo-key-123"
    name: "demo"
    rate_limit:
      requests_per_second: 5
      burst: 10

# Keys without an explicit rate_limit use this default.
default_rate_limit:
  requests_per_second: 10
  burst: 20

# Optional: gate individual tools behind scopes. A tool named here may
# be called only by a client holding at least one of its listed scopes
# (API key scopes, a JWT's scope/scp claim, or an introspected token's
# scope claim); gated tools are also hidden from tools/list for clients
# without a granting scope. Tools not named here stay open to any
# authenticated client.
# tool_scopes:
#   drop_table: ["tools:admin"]

# Optional: accept opaque OAuth2 bearer tokens via RFC 7662 introspection.
# oauth:
#   introspection_url: "https://auth.example.com/oauth/introspect"
#   client_id: "gateway"
#   client_secret: "replace-with-the-client-secret"
#   cache_ttl: 60s

backends:
  # A local MCP server spawned over stdio (the included echo-backend).
  - name: "echo"
    transport: "stdio"
    command: ["./echo-backend"]
    timeout: 10s
    cache:
      tools_list_ttl: 60s
      tools_call_ttl: 30s
      # Only tools listed here may have their calls cached.
      # Tool calls can have side effects; never cache a tool you
      # haven't verified is read-only / idempotent.
      cacheable_tools: ["echo", "add"]
    # Optional: reshape tool schemas as clients see them (see
    # "Schema rewriting" in the README). Renamed arguments appear
    # under their client-facing name in tools/list and are
    # translated back on tools/call; hidden arguments are removed
    # from the exposed schema and stripped from calls.
    # schema_rewrites:
    #   - tool: "add"
    #     rename_arguments: {a: "first", b: "second"}
    #     hide_arguments: ["debug"]
    breaker:
      failure_threshold: 5
      cooldown: 30s
    # Optional: actively probe the backend so the gateway fails fast
    # (503) while it is down, instead of timing out real requests
    # against it (see "Backend health checks" in the README). A zero
    # interval disables probing.
    # health_check:
    #   interval: 30s
    #   timeout: 5s
    #   failure_threshold: 3

  # A remote MCP server reached over Streamable HTTP. Commented out
  # because there is no server at this URL by default; uncomment and
  # point it at a real MCP endpoint to use it.
  # - name: "remote"
  #   transport: "http"
  #   url: "http://localhost:9000/mcp"
  #   auth:
  #     type: "bearer"
  #     token: "replace-with-the-backend-token"
  #   timeout: 10s
  #   # Load balancing: list several identical endpoints instead of one
  #   # url and requests spread round-robin across them; an endpoint
  #   # that fails is skipped until it recovers (see "Load balancing"
  #   # in the README). url and endpoints are mutually exclusive.
  #   # endpoints:
  #   #   - "http://localhost:9000/mcp"
  #   #   - "http://localhost:9001/mcp"
  #   # strategy: "round_robin"
  #   cache:
  #     tools_list_ttl: 60s
  #     tools_call_ttl: 0s
  #   breaker:
  #     failure_threshold: 5
  #     cooldown: 30s
